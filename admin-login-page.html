<html lang="en">

<body>
    <div class="container">

        <!-- NAV -->
        <nav>
            <span class="fas fa-bell"></span>

            <ul class="two">

        <!-- BODY -->

            <form action="">

                <div class="password">

                        <span class="fas fa-lock"></span>

                <div class="remember">
                    <div>
                        <label for="">

                        </label>
                    </div>
                    <p><a href="">Forgot password?</a></p>
                </div>
                
                <a href="dashboard.html" class="button"><span class="fa fa-arrow-right"></span> Login to Dashboard</a>
                <!-- <button> <span class="fa fa-arrow-right"></span> Login to Dashboard</button> -->

                    <span class="fas fa-check"></span>
