<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/register-page.css">
</head>

<body>
    <div class="container">
        <div class="container">

            <!-- NAV -->
            <nav>
                <span class="fas fa-bell"></span>
                <ul class="one">
                    <li><a href="" class="logo"> <span class="dine">Dine</span>Connect</a></li>
                    <li class="Discover">Discover. Order. Enjoy</li>
                </ul>

                <ul class="two">
                    <li class="account">Already Registered?</li>
                    <li class="Register"><a href="login-page.html">Login</a></li>
                </ul>
            </nav>

            <!-- BODY -->
            <div class="body">
                <div class="create">
                    <h1>Create Account</h1>
                    <p class="p1">Join DineConnect and enjoy the best dining <br>experience</p>
                    
                </div>

                <!-- FORM -->
                <form action="">

                    <div class="n">
                        <div class="name">
                            <label for="">Full Name</label>
                            <div>
                                <span class="fa fa-user"></span>
                                <input type="text"b placeholder="Enter your full name">
                            </div>
                        </div>

                        <div class="phone">
                            <label for="">Phone Number</label>
                            <div>
                                <span class="fa fa-phone"></span>
                                <input type="text" placeholder="Enter phone number">
                            </div>
                        </div>
                    </div>

                    <div class="email">
                        <label for="">Email Address</label>
                        <div>
                            <span class="fas fa-envelope"></span>
                            <input type="email" placeholder="Enter your email">
                        </div>
                    </div>

                    <div class="password">
                        <label for="">Password</label>
                        <div>
                            <span class="fas fa-lock"></span>
                            <input type="Password" placeholder="Enter your password">
                            <span class="fas fa-low-vision"></span>
                        </div>
                    </div>

                    <div class="confirm">
                    <label for="">Confirm Password</label>
                    <div>
                        <span class="fas fa-lock"></span>
                    <input type="Password" placeholder="Enter your password">
                    <span class="fas fa-low-vision"></span>
                    </div>
                </div>

                    <div class="agree">
                            <!-- <span class="fas fa-check"></span> -->
                            <label for="">
                                <input type="checkbox" name="music"> I agree to the <a href="">Terms & Conditions</a> and <a href="">Privacy Policy</a>
                            </label>
                    </div>

                    <button>Create Account</button>

                    <p class="signup">or sign up with</p>

                    <!-- SOCIALS -->
                    <div class="socials">
                        <div class="google">
                            <img src="IMG/google-removebg-preview.png" alt="">
                            <p>Google</p>
                        </div>

                        <div class="facebook">
                            <img src="IMG/facebook.png" alt="">
                            <p>facebook</p>
                        </div>
                    </div>

                    <div class="safe">
                        <span class="fas fa-check"></span>
                        <p>your data is safe and secure with us</p>
                    </div>
                </form>
            </div>


        </div>
    </div>
    </div>
</body>
