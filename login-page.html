<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/login-page.css">
</head>

<body>
    <div class="container">

        <!-- NAV -->
        <nav>
            <span class="fas fa-bell"></span>
            <ul class="one">
                <li><a href="" class="logo"> <span class="dine">Dine</span>Connect</a></li>
                <li class="Discover">Discover. Order. Enjoy</li>
            </ul>

            <ul class="two">
                <li class="account">Don't have an account ?</li>
                <li class="Register"><a href="register-page.html">Register</a></li>
            </ul>
        </nav>

        <!-- BODY -->
        <div class="body">
            <div class="welcome">
                <h1>Welcome Back</h1>
                <p class="p1">Login to continue to your account</p>
                <p class="p2"><a href="admin-login-page.html">Login as an admin</a></p>
            </div>

            <!-- FORM -->
            <form action="">
                <div class="email">
                    <label for="">Email Address</label>
                    <div>
                        <span class="fas fa-envelope"></span>
                        <input type="email" placeholder="Enter your email">
                    </div>
                </div>

                <div class="password">
                    <label for="">Password</label>
                    <div>
                        <span class="fas fa-lock"></span>
                        <input type="Password" placeholder="Enter your password">
                        <span class="fas fa-low-vision"></span>
                    </div>
                </div>

                <div class="remember">
                    <div>
                        <!-- <span class="fas fa-check"></span> -->
                        <label for="">
                            <input type="checkbox" name="music"> Remember me
                        </label>
                    </div>
                    <p><a href="">Forgot password?</a></p>
                </div>

                <button>Log In</button>

                <p class="continue">or continue with</p>

                <!-- SOCIALS -->
                <div class="socials">
                    <div class="google">
                        <img src="IMG/google-removebg-preview.png" alt="">
                        <p>Google</p>
                    </div>

                    <div class="facebook">
                        <img src="IMG/facebook.png" alt="">
                        <p>facebook</p>
                    </div>
                </div>

                <div class="safe">
                    <span class="fas fa-check"></span>
                    <p>your data is safe and secure with us</p>
                </div>
            </form>
        </div>
    </div>
</body>
<script src="js/all.js"></script>

</html>
